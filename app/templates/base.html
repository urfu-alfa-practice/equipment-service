<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Заявки{% endblock %} · Лаборатория</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main">К содержимому</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Лаборатория — все заявки">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/>
            </svg>
          </span>
          Лаборатория<span class="brand-caption">Сервис оборудования</span>
        </a>
        <nav aria-label="Главное меню">
          <a class="nav-link" href="/">Журнал заявок</a>
        </nav>
      </div>
    </header>
    <main id="main" class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer container">
      <span>Лаборатория <span class="footer-dot">/</span> Учебный проект</span>
      <span>Время указано в UTC</span>
    </footer>
  </body>
</html>
